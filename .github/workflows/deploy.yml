name: Deploy

on:
  push:
    branches: [main]
  # Per rifare il deploy a mano (es. dopo aver caricato nuovi secrets)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy to production
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          FUSION_WA_API_KEY: ${{ secrets.FUSION_WA_API_KEY }}
          FUSION_WA_API_SECRET: ${{ secrets.FUSION_WA_API_SECRET }}
          FUSION_WA_WEBHOOK_TOKEN: ${{ secrets.FUSION_WA_WEBHOOK_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH,FUSION_WA_API_KEY,FUSION_WA_API_SECRET,FUSION_WA_WEBHOOK_TOKEN
          timeout: 60s
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR="${DEPLOY_PATH:-/home/cristi/fusion-beauty}"
            cd "$APP_DIR"

            echo "==> Pull ultimo codice da main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "==> Chiavi Fusion WA nel .env (dai secrets del repository, solo se impostati)"
            # tocca solo queste righe; i valori non vengono mai stampati
            set_env() {
              [ -n "$2" ] || return 0
              grep -qxF "$1=$2" .env && return 0
              tmp="$(mktemp)"
              grep -v "^$1=" .env > "$tmp" || true
              printf '%s=%s\n' "$1" "$2" >> "$tmp"
              cat "$tmp" > .env
              rm -f "$tmp"
              echo "    $1 aggiornata"
            }
            set_env FUSION_WA_BASE_URL "https://fusionwa.com"
            set_env FUSION_WA_API_KEY "${FUSION_WA_API_KEY:-}"
            set_env FUSION_WA_API_SECRET "${FUSION_WA_API_SECRET:-}"
            set_env FUSION_WA_WEBHOOK_TOKEN "${FUSION_WA_WEBHOOK_TOKEN:-}"

            echo "==> Build immagini Docker"
            docker compose -f docker-compose.prod.yml build

            echo "==> Rigenerazione client Prisma"
            docker compose -f docker-compose.prod.yml run --rm worker npx prisma generate

            echo "==> Migrazioni database"
            docker compose -f docker-compose.prod.yml run --rm worker npx prisma migrate deploy

            echo "==> Form del sito de La Boutique del Benessere (solo se manca)"
            docker compose -f docker-compose.prod.yml run --rm worker npx tsx prisma/setup.boutique-forms.ts

            echo "==> Migrazione da GHL de La Boutique del Benessere (solo ciò che manca)"
            docker compose -f docker-compose.prod.yml run --rm worker npx tsx prisma/setup.boutique-migration.ts
            docker compose -f docker-compose.prod.yml run --rm worker npx tsx prisma/setup.boutique-staff.ts
            docker compose -f docker-compose.prod.yml run --rm worker npx tsx prisma/setup.boutique-consents.ts
            docker compose -f docker-compose.prod.yml run --rm worker npx tsx prisma/setup.assign-operators.ts

            echo "==> Riavvio servizi in background"
            docker compose -f docker-compose.prod.yml up -d --build

            echo "==> Pulizia immagini inutilizzate"
            docker image prune -f

            echo "==> Deploy completato"
